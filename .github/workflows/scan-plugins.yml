name: Scan Plugins

# Policy credentials are available only to an explicit run of trusted main.
# Pull requests run contract tests without OIDC or write permissions. A manual
# run reads the requested PR SHA as data; it never checks out or executes it.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open single-plugin pin PR to review
        required: true
        type: string
      expected_head_sha:
        description: Exact 40-character PR head SHA approved for review
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: plugin-policy-${{ github.event.pull_request.number || inputs.pr_number || github.ref }}
  cancel-in-progress: false

jobs:
  contract-tests:
    name: Policy scanner contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: node --test .github/scripts/policy-*.test.mjs

  policy-review:
    name: Federated policy review
    needs: contract-tests
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'shaboooooozy1/knowledge-work-plugins' &&
      github.repository_id == '1272807675'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      id-token: write
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Review exact plugin pin
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          POLICY_SCAN_MODEL: ${{ vars.POLICY_SCAN_MODEL || 'claude-sonnet-5-5' }}
        run: node .github/scripts/run-policy-scan.mjs
      - name: Upload review evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scan-verdicts
          path: |
            .scan-cache/run-verdicts.json
            .scan-cache/run-failed.json
            .scan-cache/scan-status.json
            .scan-cache/source-inventory.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
